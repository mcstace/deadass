<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DEADASS — Fragrances</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --cream: #e8e4d9;
      --cream-dim: rgba(232, 228, 217, 0.55);
      --black: #080808;
    }

    html, body {
      height: 100%;
      background: var(--black);
      color: var(--cream);
      font-family: 'IM Fell English', serif;
      overflow-x: hidden;
    }

    /* subtle grain overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
      opacity: 0.035;
      pointer-events: none;
      z-index: 100;
    }

    .scene {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
      position: relative;
    }

    /* faint vignette */
    .scene::after {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.72) 100%);
      pointer-events: none;
    }

    .wordmark {
      text-align: center;
      opacity: 0;
      animation: rise 1.6s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
    }

    .brand-name {
      font-family: 'IM Fell English SC', serif;
      font-size: clamp(3.2rem, 12vw, 9rem);
      letter-spacing: 0.12em;
      color: var(--cream);
      line-height: 1;
      font-weight: 400;
    }

    .brand-sub {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(0.7rem, 2.2vw, 1.05rem);
      letter-spacing: 0.55em;
      text-transform: uppercase;
      color: var(--cream-dim);
      margin-top: 0.55rem;
      font-weight: 300;
    }

    .divider {
      width: 1px;
      height: 0;
      background: var(--cream-dim);
      margin: 3.5rem auto;
      animation: grow 1s cubic-bezier(0.16, 1, 0.3, 1) 1.1s forwards;
    }

    .coming-soon {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: clamp(0.85rem, 2.5vw, 1.15rem);
      letter-spacing: 0.3em;
      color: var(--cream-dim);
      text-align: center;
      opacity: 0;
      animation: rise 1.2s cubic-bezier(0.16, 1, 0.3, 1) 1.4s forwards;
    }

    .waitlist {
      margin-top: 3.5rem;
      text-align: center;
      opacity: 0;
      animation: rise 1.2s cubic-bezier(0.16, 1, 0.3, 1) 1.9s forwards;
      width: 100%;
      max-width: 380px;
    }

    .waitlist-label {
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.7rem;
      letter-spacing: 0.5em;
      text-transform: uppercase;
      color: var(--cream-dim);
      margin-bottom: 1.2rem;
      font-weight: 300;
    }

    .waitlist-form {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      align-items: center;
    }

    .waitlist-input {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(232, 228, 217, 0.3);
      padding: 0.65rem 0.1rem;
      color: var(--cream);
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.95rem;
      letter-spacing: 0.1em;
      outline: none;
      transition: border-color 0.3s;
      text-align: center;
    }

    .waitlist-input::placeholder {
      color: rgba(232, 228, 217, 0.28);
      letter-spacing: 0.25em;
      font-size: 0.8rem;
    }

    .waitlist-input:focus {
      border-color: rgba(232, 228, 217, 0.7);
    }

    .waitlist-btn {
      margin-top: 0.4rem;
      background: transparent;
      border: 1px solid rgba(232, 228, 217, 0.35);
      color: var(--cream-dim);
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.7rem;
      letter-spacing: 0.5em;
      text-transform: uppercase;
      padding: 0.75rem 2.5rem;
      cursor: pointer;
      transition: border-color 0.3s, color 0.3s, background 0.3s;
    }

    .waitlist-btn:hover {
      border-color: var(--cream);
      color: var(--cream);
      background: rgba(232, 228, 217, 0.04);
    }

    .success-msg {
      display: none;
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 0.9rem;
      letter-spacing: 0.2em;
      color: var(--cream-dim);
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes grow {
      from { height: 0; }
      to   { height: 50px; }
    }
  </style>
</head>
<body>
  <div class="scene">
    <div class="wordmark">
      <div class="brand-name">DEADASS</div>
      <div class="brand-sub">Fragrances</div>
    </div>

    <div class="divider"></div>

    <div class="coming-soon">coming soon</div>

    <div class="waitlist">
      <div class="waitlist-label">Join the Waitlist</div>
      <form class="waitlist-form" id="form">
        <input
          class="waitlist-input"
          type="email"
          placeholder="your@email.com"
          required
          id="email"
          autocomplete="email"
        />
        <button class="waitlist-btn" type="submit">Reserve Your Place</button>
      </form>
      <div class="success-msg" id="success">You're on the list.</div>
    </div>
  </div>

  <script>
    document.getElementById('form').addEventListener('submit', function(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const formId = '1FAIpQLSeszs54ky5wmCajTPLFdl0Yyq28dx16gJOzkc8yltwlPI-D0Q';
      const fieldId = 'entry.911896788';

      const formData = new FormData();
      formData.append(fieldId, email);

      fetch(`https://docs.google.com/forms/d/e/${formId}/formResponse`, {
        method: 'POST',
        mode: 'no-cors',
        body: formData
      });

      // Show success message
      document.getElementById('form').style.display = 'none';
      const msg = document.getElementById('success');
      msg.style.display = 'block';
      msg.style.animation = 'rise 1s cubic-bezier(0.16,1,0.3,1) forwards';
    });
  </script>
</body>
</html>
